<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Form</title>
</head>

<h1>Your Course Landing Page</h1>

<form action="https://www.google.com/search">
    <div>
        <label for="course_title">Course Title</label>
        <input type="text" name="courseTitle" id="course_title" required />
    </div>
    <div>
        <label for="course_description">Course Description</label>
        <textarea name="courseDescription" id="course_description"></textarea>
    </div>
    <div>
        <label for="skill_level">Skill Level</label>
        <select name="skillLevel" id="skill_level">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="experienced">Experienced</option>
        <option value="all">All level</option>
      </select>
    </div>
    <div>
        <label for="">Gender</label>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" />
        <label for="female">Female</label>
        <input type="radio" name="gender" id="female" />
    </div>
    <div>
        <label for="publish_course">Publish Course</label>
        <input type="checkbox" name="publishCourse" id="publish_course" value="true" required />
    </div>

    <button type="submit">Submit</button>
    <button type="reset">reset</button>
</form>

<body></body>

</html>
